<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Let’s Learn Korean - 한국어 공부하자</title>
  <!-- Google Fonts: Mali (Tiếng Việt) & Gaegu (Tiếng Hàn) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Mali:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Layer hiệu ứng click sinh động -->
  <div id="click-fx-layer" aria-hidden="true"></div>

  <div class="app-layout">
    <!-- THANH ĐIỀU HƯỚNG THỤT RA THỤT VÀO -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <span class="ko brand-ko" lang="ko">한국어 노트</span>
          <span class="brand-vi">Tổng Hợp Quyển 2 - 4</span>
        </div>
        <button id="sidebar-close-btn" class="icon-btn pop-click" title="Thu gọn thanh điều hướng">
          ✕
        </button>
      </div>

      <div class="sidebar-scroll">
        <p class="sidebar-hint">Chọn chủ đề (Quyển 2 → Quyển 4):</p>
        <nav id="topic-nav" class="topic-nav" aria-label="Danh sách bài học"></nav>
      </div>

      <div class="sidebar-footer">
        <div class="color-legend">
          <span class="legend-item"><i class="dot dot-blue"></i> Kiến thức chính</span>
          <span class="legend-item"><i class="dot dot-pink"></i> Phần cần lưu ý</span>
        </div>
      </div>
    </aside>

    <!-- MÀN HÌNH CHÍNH: CHỈ GỒM BANNER VÀ BÀI HỌC -->
    <div id="main-wrapper" class="main-wrapper">
      <button id="sidebar-toggle-btn" class="sidebar-toggle-btn pop-click" title="Đóng / Mở danh mục bài học">
        <img src="images/icon-menu.png" alt="Menu" class="custom-img-icon"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';" />
        <span class="fallback-menu-icon" style="display:none;">☰</span>
        <span class="toggle-label">Danh mục</span>
      </button>

      <!-- BANNER CHÍNH -->
      <header class="main-banner">
        <img src="images/banner-bg.png" alt="Banner IbisPaint X" class="banner-custom-art" onerror="this.style.display='none';" />
        <div class="banner-content">
          <div class="banner-badge">Giáo trình Tiếng Hàn Tổng Hợp • Quyển 2 – 4</div>
          <h1 class="banner-title">
            Let’s Learn Korean - <span class="ko" lang="ko">한국어 공부하자</span>
          </h1>
          <p id="current-breadcrumb" class="banner-subtitle"></p>
        </div>
        <img src="images/doodle-star.png" alt="Sticker" class="banner-sticker" onerror="this.style.display='none';" />
      </header>

      <!-- KHU VỰC NỘI DUNG BÀI HỌC -->
      <main id="lesson-container" class="lesson-container"></main>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
